<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNK Tambola Live</title>
    <style>
        :root { --bg-color: #f4f4f9; --text-color: #333; --primary: #007BFF; --accent: #d32f2f; --ticket-bg: #fff; --marked: #4CAF50; }
        body { font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; }
        
        .container { max-width: 1100px; margin: auto; }
        h1 { font-size: 3em; text-transform: uppercase; letter-spacing: 2px; }
        .number-display { font-size: 6em; font-weight: bold; color: var(--accent); margin: 10px; }
        button { padding: 10px 15px; font-size: 1em; cursor: pointer; margin: 5px; border-radius: 0px; border: none; background-color: var(--primary); color: white; font-weight: bold; transition: 0.2s; text-transform: uppercase;}
        button:hover { opacity: 0.8; transform: scale(1.05); }
        input, select { padding: 10px; font-size: 1em; margin: 5px; border-radius: 0px; border: 2px solid #555; background: #fff; color: #000; }
        
        .panel { background-color: var(--ticket-bg); padding: 20px; margin: 15px auto; border-radius: 0px; border: 2px solid var(--primary); box-shadow: 4px 4px 0px var(--primary); }
        .game-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
        @media(max-width: 800px) { .game-grid { grid-template-columns: 1fr; } }
        
        /* Ticket Booth Styles */
        #poolContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-height: 500px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.1); border-radius: 0px;}
        .pool-ticket { border: 3px solid transparent; cursor: pointer; padding: 10px; background: var(--ticket-bg); transition: 0.2s;}
        .pool-ticket:hover { border-color: var(--primary); }
        .pool-ticket.selected { border-color: var(--marked); background-color: rgba(255, 255, 255, 0.1); transform: scale(1.02); }
        .ticket-title { font-weight: bold; margin-bottom: 5px; opacity: 0.8; }

        /* Actual Ticket Grid */
        .ticket-wrapper { margin-bottom: 20px; background: var(--ticket-bg); padding: 10px; border: 2px solid #777; display: inline-block;}
        .ticket-row { display: flex; justify-content: center; }
        .ticket-cell { width: 35px; height: 35px; border: 1px solid #777; display: flex; align-items: center; justify-content: center; font-size: 1.1em; font-weight: bold; cursor: pointer; user-select: none; }
        .empty-cell { background-color: rgba(0,0,0,0.1); cursor: default; }
        .marked { background-color: var(--marked) !important; color: #000; text-decoration: line-through; border-color: #000; }
        
        .invite-link-box { background: rgba(0,0,0,0.1); padding: 10px; font-family: monospace; word-wrap: break-word; border-left: 4px solid var(--primary); }
        .log { font-size: 0.9em; max-height: 150px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PUNK Tambola</h1>

        <!-- Step 1: Login & Host Area -->
        <div id="setupArea" class="panel">
            <div id="playerJoinArea">
                <h3>Join Game</h3>
                <input type="text" id="joinRoomId" placeholder="Room Code">
                <input type="text" id="playerName" placeholder="Your Name">
                <button onclick="requestTickets()">Browse Tickets</button>
            </div>
            
            <hr style="margin: 30px 0; border: 1px dashed var(--primary);">
            
            <div class="host-section">
                <h3>Host a New Game</h3>
                <input type="text" id="createRoomId" placeholder="Room Code">
                <input type="password" id="adminPassword" placeholder="Host Password">
                <br>
                <div style="margin-top: 10px;">
                    <strong>Generate Tickets:</strong> 
                    <input type="number" id="poolSize" value="30" style="width: 60px;"> tickets
                </div>
                <div style="text-align: left; display: inline-block; margin-top: 10px;">
                    <strong>Active Winning Patterns:</strong><br>
                    <label><input type="checkbox" id="pat-early5" checked> Early 5</label><br>
                    <label><input type="checkbox" id="pat-top" checked> Top Line</label><br>
                    <label><input type="checkbox" id="pat-mid" checked> Middle Line</label><br>
                    <label><input type="checkbox" id="pat-bot" checked> Bottom Line</label><br>
                    <label><input type="checkbox" id="pat-fh" checked> Full House</label>
                </div>
                <br><br>
                <button onclick="hostGame()">Initialize Room & Tickets</button>
            </div>
        </div>

        <!-- Step 2: The Ticket Booth -->
        <div id="ticketSelectionArea" class="panel" style="display:none;">
            <h2>Select Your Tickets</h2>
            <p>Select one or more tickets you want to play with, then click Confirm.</p>
            <div id="poolContainer"></div>
            <button onclick="confirmTicketSelection()" style="background-color: var(--marked); color: #000; font-size: 1.2em; margin-top: 20px; padding: 15px 30px;">Confirm Selection & Enter Game</button>
        </div>

        <!-- Step 3: Main Game Area -->
        <div id="gameArea" style="display:none;">
            <div class="game-grid">
                
                <div class="panel">
                    <h3>Winning Claims</h3>
                    <div id="claimsList" style="text-align: left; font-size: 1.1em;"></div>
                </div>

                <div class="panel">
                    <h2>Current Call</h2>
                    <div class="number-display" id="currentNumber">--</div>
                    
                    <div id="myTicketArea" style="display: none;">
                        <h3>My Tickets</h3>
                        <div id="activeTicketsContainer"></div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h4>Called Numbers</h4>
                        <p id="history"></p>
                    </div>
                </div>

                <div class="panel">
                    <h3 id="roomDisplay"></h3>
                    <div id="hostControls" style="display:none;">
                        <div class="invite-link-box">
                            <strong>Invite Link:</strong><br>
                            <span id="inviteLinkText"></span>
                        </div>
                        <hr style="border: 1px dashed var(--primary); margin: 15px 0;">
                        <button id="drawBtn" onclick="draw()" style="font-size:1.2em; padding:10px 20px; width: 100%;">Draw Number</button>
                        
                        <div style="margin-top:15px;">
                            <strong>Auto-Draw:</strong>
                            <input type="number" id="autoDrawTime" value="5" style="width: 50px;"> secs
                            <button onclick="toggleAutoDraw()" id="autoBtn">Start Auto</button>
                        </div>
                        
                        <div style="margin-top:15px;">
                            <strong>Theme:</strong>
                            <select id="themeSelect" onchange="updateTheme()">
                                <option value="modern">Modern Light</option>
                                <option value="punk">Neon Punk</option>
                                <option value="bihu">Bihu Festival</option>
                            </select>
                        </div>
                    </div>
                    <hr style="border: 1px dashed var(--primary); margin: 15px 0;">
                    <h4>Game Log</h4>
                    <div id="gameLog" class="log"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';
        let isHost = false;
        let selectedTicketIds = [];
        let storedPlayerName = '';
        let autoDrawInterval = null;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            document.getElementById('joinRoomId').value = urlParams.get('room');
            document.getElementById('joinRoomId').disabled = true;
        }

        function renderTicketHTML(numbers) {
            let html = '';
            let numIndex = 0;
            for (let r = 0; r < 3; r++) {
                html += '<div class="ticket-row">';
                for (let c = 0; c < 9; c++) {
                    if (numIndex < 15 && Math.random() > 0.4) {
                        html += `<div class="ticket-cell" onclick="markNumber(this)">${numbers[numIndex]}</div>`;
                        numIndex++;
                    } else {
                        html += `<div class="ticket-cell empty-cell"></div>`;
                    }
                }
                html += '</div>';
            }
            return html;
        }

        function markNumber(element) {
            if(!element.classList.contains('empty-cell')) element.classList.toggle('marked');
        }

        // --- HOST LOGIC ---
        function hostGame() {
            currentRoom = document.getElementById('createRoomId').value;
            const password = document.getElementById('adminPassword').value;
            const ticketCount = parseInt(document.getElementById('poolSize').value) || 30;
            
            const patterns = {
                'Early 5': document.getElementById('pat-early5').checked,
                'Top Line': document.getElementById('pat-top').checked,
                'Middle Line': document.getElementById('pat-mid').checked,
                'Bottom Line': document.getElementById('pat-bot').checked,
                'Full House': document.getElementById('pat-fh').checked
            };

            socket.emit('createRoom', currentRoom, password, patterns, ticketCount);
        }

        socket.on('roomCreatedSuccess', () => {
            isHost = true;
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('hostControls').style.display = 'block';
            document.getElementById('roomDisplay').innerText = "HOSTING ROOM: " + currentRoom;
            
            const link = window.location.origin + "?room=" + currentRoom;
            document.getElementById('inviteLinkText').innerText = link;
        });

        // --- PLAYER TICKET SELECTION ---
        function requestTickets() {
            currentRoom = document.getElementById('joinRoomId').value;
            storedPlayerName = document.getElementById('playerName').value;
            if(!storedPlayerName) return alert("Enter your name!");
            socket.emit('requestTickets', currentRoom, storedPlayerName);
        }

        socket.on('showTicketPool', (availableTickets) => {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('ticketSelectionArea').style.display = 'block';
            
            let container = document.getElementById('poolContainer');
            container.innerHTML = '';
            
            availableTickets.forEach(ticket => {
                let div = document.createElement('div');
                div.className = 'pool-ticket';
                div.id = `pool-ticket-${ticket.id}`;
                div.innerHTML = `<div class="ticket-title">TICKET #${ticket.id}</div>` + renderTicketHTML(ticket.numbers);
                
                div.onclick = () => {
                    div.classList.toggle('selected');
                    if(selectedTicketIds.includes(ticket.id)) {
                        selectedTicketIds = selectedTicketIds.filter(id => id !== ticket.id);
                    } else {
                        selectedTicketIds.push(ticket.id);
                    }
                };
                container.appendChild(div);
            });
        });

        function confirmTicketSelection() {
            if(selectedTicketIds.length === 0) return alert("Please select at least one ticket.");
            socket.emit('claimTickets', currentRoom, storedPlayerName, selectedTicketIds);
        }

        socket.on('ticketsConfirmed', (confirmedTickets, gameState) => {
            document.getElementById('ticketSelectionArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('roomDisplay').innerText = "ROOM: " + currentRoom;
            
            document.getElementById('myTicketArea').style.display = 'block';
            let activeContainer = document.getElementById('activeTicketsContainer');
            confirmedTickets.forEach(ticket => {
                activeContainer.innerHTML += `<div class="ticket-wrapper"><div class="ticket-title">TICKET #${ticket.id}</div>${renderTicketHTML(ticket.numbers)}</div>`;
            });

            let claimsHtml = '';
            for (const [pattern, isActive] of Object.entries(gameState.patterns)) {
                if (isActive) {
                    claimsHtml += `<div style="margin-bottom: 10px;"><strong>${pattern}</strong><br><button onclick="makeClaim('${pattern}')">Claim</button></div>`;
                }
            }
            document.getElementById('claimsList').innerHTML = claimsHtml;
        });

        // --- GAMEPLAY ---
        function draw() { socket.emit('drawNumber', currentRoom); }

        function toggleAutoDraw() {
            let btn = document.getElementById('autoBtn');
            if (autoDrawInterval) {
                clearInterval(autoDrawInterval);
                autoDrawInterval = null;
                btn.innerText = "Start Auto";
                btn.style.backgroundColor = "var(--primary)";
            } else {
                let time = parseInt(document.getElementById('autoDrawTime').value) * 1000;
                draw();
                autoDrawInterval = setInterval(draw, time);
                btn.innerText = "Stop Auto";
                btn.style.backgroundColor = "#d32f2f";
            }
        }

        socket.on('numberDrawn', (number) => {
            document.getElementById('currentNumber').innerText = number;
            document.getElementById('history').innerText += number + " • ";
            let speech = new SpeechSynthesisUtterance(number.toString());
            window.speechSynthesis.speak(speech);
        });

        function makeClaim(pattern) { socket.emit('claimPattern', currentRoom, pattern); }

        socket.on('winnerAnnounced', (data) => {
            let log = document.getElementById('gameLog');
            log.innerHTML += `<div style="color:var(--marked); font-weight:bold;">⚡ ${data.name} claimed ${data.pattern}!</div>`;
            log.scrollTop = log.scrollHeight;
        });

        socket.on('errorMsg', (msg) => { alert(msg); });
        socket.on('sysMessage', (msg) => {
            let log = document.getElementById('gameLog');
            log.innerHTML += `<div>${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        });

        // --- THEMES ---
        function updateTheme() { socket.emit('changeTheme', currentRoom, document.getElementById('themeSelect').value); }
        
        socket.on('applyTheme', (theme) => {
            const root = document.documentElement;
            if (theme === 'punk') {
                root.style.setProperty('--bg-color', '#0d0d0d'); 
                root.style.setProperty('--text-color', '#39ff14'); 
                root.style.setProperty('--ticket-bg', '#1a1a1a'); 
                root.style.setProperty('--primary', '#ff00ff'); 
                root.style.setProperty('--marked', '#00ffff'); 
                root.style.setProperty('--accent', '#ff00ff');
            } else if (theme === 'bihu') {
                root.style.setProperty('--bg-color', '#fff8dc'); 
                root.style.setProperty('--text-color', '#8b0000'); 
                root.style.setProperty('--ticket-bg', '#ffebcd'); 
                root.style.setProperty('--primary', '#228b22'); 
                root.style.setProperty('--marked', '#ff8c00'); 
                root.style.setProperty('--accent', '#d32f2f');
            } else {
                root.style.setProperty('--bg-color', '#f4f4f9');
                root.style.setProperty('--text-color', '#333');
                root.style.setProperty('--ticket-bg', '#fff');
                root.style.setProperty('--primary', '#007BFF');
                root.style.setProperty('--marked', '#4CAF50');
                root.style.setProperty('--accent', '#d32f2f');
            }
        });
    </script>
</body>
</html>
