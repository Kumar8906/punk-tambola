<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Tambola!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        
        .panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        h1 { color: #000080; text-transform: uppercase; font-weight: 900; }
        input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; width: 80%; max-width: 300px; margin-bottom: 15px; }
        button { background: #0000cd; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #000080; }

        /* Ticket Pool Styles */
        #poolContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-height: 400px; overflow-y: auto; background: #eef2f6; padding: 15px; border-radius: 10px; }
        .ticket-wrapper { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .ticket-wrapper:hover { transform: translateY(-2px); }
        .selected-ticket { border-color: #0000cd; background-color: #f0f8ff; }
        .ticket-title { font-weight: bold; margin-bottom: 8px; color: #0000cd; }

        /* Ticket Grid inside Wrapper */
        .ticket-row { display: flex; justify-content: center; }
        .ticket-cell { width: 35px; height: 35px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .empty-cell { background-color: #f9f9f9; color: transparent; }
        
        /* Auto-Marked Number Style */
        .marked { background-color: #16a34a !important; color: white !important; border-radius: 5px; border-color: #16a34a; transform: scale(0.9); transition: 0.3s; }

        /* Game Area Styles */
        .current-call { font-size: 60px; color: red; font-weight: 900; background: #fff; padding: 10px; border-radius: 10px; border: 2px solid red; display: inline-block; min-width: 80px; margin: 10px 0; }
        
        .grid-1-90 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 15px; background: #fff; border-radius: 10px; border: 1px solid #ccc; }
        .num-dot { border: 1px solid #eee; padding: 8px 2px; font-size: 14px; text-align: center; border-radius: 4px; color: #666; }
        .called { background: #0000cd !important; color: white !important; font-weight: bold; border-color: #0000cd; }
    </style>
</head>
<body>

<div class="container">
    <h1>PUNK TAMBOLA</h1>

    <!-- 1. JOIN SCREEN -->
    <div id="joinArea" class="panel">
        <h2>Join Live Game</h2>
        <input type="text" id="playerName" placeholder="Enter your Name"><br>
        <button onclick="requestTickets()">Browse Tickets</button>
    </div>

    <!-- 2. TICKET SELECTION BOOTH -->
    <div id="ticketSelectionArea" class="panel" style="display:none;">
        <h2>Tap to Select Your Tickets</h2>
        <div id="poolContainer"></div>
        <br>
        <button onclick="confirmTickets()" style="background: #16a34a; width: 100%;">Enter Game</button>
    </div>

    <!-- 3. MAIN GAME SCREEN -->
    <div id="gameArea" style="display:none;">
        
        <!-- Live Call Display -->
        <div class="panel">
            <h3>CURRENT CALL</h3>
            <div class="current-call" id="currentNum">--</div>
        </div>

        <!-- Player's Active Tickets -->
        <div class="panel">
            <h3 style="color: #0000cd;">MY TICKETS</h3>
            <div id="myTicketsContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;"></div>
        </div>

        <!-- 1-90 Called Number Board -->
        <div class="panel">
            <h3>NUMBERS CALLED</h3>
            <div class="grid-1-90" id="board"></div>
        </div>

    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const roomId = "LIVE_ROOM"; 
    let selectedTicketIds = [];
    let myName = '';

    // Initialize 1-90 Board
    const board = document.getElementById('board');
    for(let i=1; i<=90; i++) { board.innerHTML += `<div class="num-dot" id="dot-${i}">${i}</div>`; }

    // Renders the 3x9 ticket layout
    function renderTicketHTML(numbers) {
        let html = '';
        let numIndex = 0;
        for (let r = 0; r < 3; r++) {
            html += '<div class="ticket-row">';
            for (let c = 0; c < 9; c++) {
                if (numIndex < 15 && Math.random() > 0.4) {
                    html += `<div class="ticket-cell playable-number" data-num="${numbers[numIndex]}">${numbers[numIndex]}</div>`;
                    numIndex++;
                } else {
                    html += `<div class="ticket-cell empty-cell"></div>`;
                }
            }
            html += '</div>';
        }
        return html;
    }

    // Step 1: Request Tickets
    function requestTickets() {
        myName = document.getElementById('playerName').value;
        if(myName.trim() === '') return alert("Please enter your name!");
        socket.emit('requestTickets', roomId, myName);
    }

    // Step 2: Show Ticket Booth
    socket.on('showTicketPool', (availableTickets) => {
        document.getElementById('joinArea').style.display = 'none';
        document.getElementById('ticketSelectionArea').style.display = 'block';
        
        let container = document.getElementById('poolContainer');
        container.innerHTML = '';
        
        availableTickets.forEach(ticket => {
            let div = document.createElement('div');
            div.className = 'ticket-wrapper';
            div.innerHTML = `<div class="ticket-title">Ticket #${ticket.id}</div>` + renderTicketHTML(ticket.numbers);
            
            // Allow player to select/deselect
            div.onclick = () => {
                if(selectedTicketIds.includes(ticket.id)) {
                    selectedTicketIds = selectedTicketIds.filter(id => id !== ticket.id);
                    div.classList.remove('selected-ticket');
                } else {
                    selectedTicketIds.push(ticket.id);
                    div.classList.add('selected-ticket');
                }
            };
            container.appendChild(div);
        });
    });

    // Step 3: Confirm and Enter Game
    function confirmTickets() {
        if(selectedTicketIds.length === 0) return alert("Please select at least one ticket.");
        socket.emit('claimTickets', roomId, myName, selectedTicketIds);
    }

    // Step 4: Display Game Board
    socket.on('ticketsConfirmed', (confirmedTickets, drawnNumbersHistory) => {
        document.getElementById('ticketSelectionArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
        
        // Render My Tickets
        let myContainer = document.getElementById('myTicketsContainer');
        confirmedTickets.forEach(ticket => {
            myContainer.innerHTML += `<div class="ticket-wrapper" style="cursor: default;"><div class="ticket-title">Ticket #${ticket.id}</div>${renderTicketHTML(ticket.numbers)}</div>`;
        });

        // Catch up on numbers that were drawn before the player joined
        drawnNumbersHistory.forEach(num => markNumber(num));
    });

    // Step 5: Handle Live Numbers & AUTO-MARK
    socket.on('numberDrawn', (num) => {
        document.getElementById('currentNum').innerText = num;
        markNumber(num);
    });

    function markNumber(num) {
        // Highlight on the 1-90 board
        const dot = document.getElementById(`dot-${num}`);
        if(dot) dot.classList.add('called');

        // --- AUTO-SELECT LOGIC ---
        // Find every cell on the player's tickets and mark it if it matches
        const allCells = document.querySelectorAll('.playable-number');
        allCells.forEach(cell => {
            if (parseInt(cell.getAttribute('data-num')) === parseInt(num)) {
                cell.classList.add('marked');
            }
        });
    }

    socket.on('errorMsg', (msg) => alert(msg));
</script>
</body>
</html>
